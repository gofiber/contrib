name: "Test spnego"

on:
  push:
    branches:
      - master
      - main
  pull_request:
    paths:
      - 'v3/spnego/**/*.go'
      - 'v3/spnego/go.mod'
      - 'v3/spnego/go.sum'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      GOWORK: off
    strategy:
      matrix:
        go-version:
          - 1.25.x
          - 1.26.x
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '${{ matrix.go-version }}'
          cache-dependency-path: v3/spnego/go.sum
      # This module carries build-tagged sources for file identity. The Linux
      # test run compiles only the unix variant, and darwin is unix too, so
      # js/wasm is what actually covers the !unix && !windows fallback.
      - name: Vet other platforms
        working-directory: ./v3/spnego
        run: |
          for target in windows/amd64 js/wasm; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done
      - name: Run Test
        uses: gofiber/.github/.github/actions/gotestsum@main
        with:
          working-directory: ./v3/spnego
          packages: ./...
          rerun-fails: '2'
          args: -race -count=1
